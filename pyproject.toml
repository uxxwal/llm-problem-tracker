[project]
name = "problem-tracker"
version = "0.1.0"
description = "Problem description extractor, tracks how the users problems evolves across multiple turns"
readme = "README.md"
authors = [
    { name = "Ujjwal Dar", email = "ujjwaldar101@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "openai>=3.19.2",
]



[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]
[tool.mypy]
python_version = "3.12"
files = ['src']
check_untyped_defs = true
warn_unused_ignores = true

